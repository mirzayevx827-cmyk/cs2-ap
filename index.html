<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHOT CS2</title><script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#0b0c0e;color:#fff;padding:12px 12px 80px}
.card{background:#16181d;border-radius:14px;padding:12px;margin-bottom:10px}.prof{display:flex;align-items:center;gap:10px}
.bal{font-size:22px;font-weight:800}.lvl{background:#233322;color:#4cd964;font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px;margin-left:auto}
.btn{background:#0088cc;color:#fff;border:none;width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:700;margin-bottom:10px}
.sec{display:none}.sec.act{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r-box{position:relative;height:95px;background:#16181d;border-radius:12px;overflow:hidden;margin:10px 0;border:1px solid #2a2e37}
.ptr{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#0088cc;z-index:5}.tape{display:flex;height:100%;transition:transform 4s cubic-bezier(.1,.85,.2,1)}
.s-item{min-width:95px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #222;font-size:11px;text-align:center}
.nav{position:fixed;bottom:8px;left:10px;right:10px;background:#1c1f26;border-radius:18px;display:flex;justify-content:space-around;padding:8px;border:1px solid #2a2e37}
.n-btn{background:none;border:none;color:#7a828e;font-size:11px;padding:4px 8px;border-radius:10px}.n-btn.act{background:#2c303a;color:#fff}
</style></head><body>

<div class="card"><div class="prof"><div style="font-size:28px">👤</div><div><div class="bal"><span id="bal">3 707</span> 🪙</div><div style="font-size:11px;color:#7a828e" id="xpTxt">459 XP</div></div><div class="lvl" id="lvl">LVL 1</div></div></div>

<div id="home" class="sec act">
  <button class="btn" onclick="document.getElementById('pay').style.display='flex'">💳 Tanga sotib olish</button>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center"><b>Steam Trade URL</b><button class="n-btn act" onclick="setUrl()">Kiritish</button></div>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center"><b>Kunlik bonus</b><button class="n-btn act" onclick="upd(230,50);this.disabled=true">+230 🪙</button></div>
</div>

<div id="cases" class="sec">
  <h3 id="cTitle">📦 Fracture Case (500 🪙)</h3>
  <div class="r-box"><div class="ptr"></div><div class="tape" id="tape"></div></div>
  <button class="btn" id="spBtn" onclick="spin()">Keys ochish — 500 🪙</button>
  <div id="cRes" style="text-align:center;color:#4cd964;font-weight:700;margin-bottom:8px"></div>
  <div id="drops" style="font-size:12px;color:#aaa;background:#16181d;padding:10px;border-radius:10px;margin-bottom:10px"></div>
  <div class="grid" id="cGrid"></div>
</div>

<div id="shop" class="sec"><div class="grid" id="sGrid"></div></div>
<div id="inv" class="sec"><div class="grid" id="iGrid"></div></div>

<div id="pay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;align-items:center;justify-content:center;padding:15px">
  <div style="background:#16181d;border:1px solid #0088cc;border-radius:16px;padding:18px;width:100%;max-width:340px;text-align:center">
    <h3>💳 Tanga sotib olish</h3><br><p style="font-size:13px">25 000 so'm — <b>30 000 🪙</b></p><br>
    <div onclick="navigator.clipboard.writeText('9860020144030861');alert('Nusxalandi!')" style="background:#232730;padding:12px;border-radius:10px;font-weight:800;color:#00aaff;margin-bottom:12px">9860 0201 4403 0861 📋</div>
    <button class="btn" onclick="tg.close()">📸 Chekni yuborish</button>
    <button onclick="document.getElementById('pay').style.display='none'" style="background:none;border:none;color:#888">Yopish</button>
  </div>
</div>

<div class="nav">
  <button class="n-btn act" onclick="tab('home',this)">🏠 Asosiy</button>
  <button class="n-btn" onclick="tab('cases',this)">📦 Keyslar</button>
  <button class="n-btn" onclick="tab('shop',this)">🛒 Magazin</button>
  <button class="n-btn" onclick="tab('inv',this)">🎒 Inventar</button>
</div>

<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();
let bal=Number(localStorage.getItem('b'))||3707,xp=Number(localStorage.getItem('x'))||459,cIdx=0,inv=JSON.parse(localStorage.getItem('i')||'[]');
function upd(v,x=0){bal+=v;xp+=x;localStorage.setItem('b',bal);localStorage.setItem('x',xp);document.getElementById('bal').innerText=bal.toLocaleString();document.getElementById('lvl').innerText='LVL '+(Math.floor(xp/500)+1);document.getElementById('xpTxt').innerText=xp+' XP';}
upd(0);
function setUrl(){let u=prompt("Steam Trade URL:");if(u)localStorage.setItem('u',u);}
function tab(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('act'));document.querySelectorAll('.n-btn').forEach(b=>b.classList.remove('act'));document.getElementById(id).classList.add('act');el.classList.add('act');if(id==='inv')drawInv();}

const cases=[
  {n:'📦 Fracture',p:500,s:[{n:'🔫 P250 Sand',v:250},{n:'🔫 Glock Bunsen',v:450},{n:'💥 Deagle',v:1200}]},
  {n:'🥉 Recoil',p:1000,s:[{n:'🔫 USP Ticket',v:500},{n:'🔥 AK-47 Ice',v:1100},{n:'🎯 AWP Chromatic',v:2800}]},
  {n:'🥈 Revolution',p:2500,s:[{n:'🔫 MP9 Feather',v:1200},{n:'🔥 M4A4 Temukau',v:3000},{n:'🧤 ★ Gloves',v:7500}]},
  {n:'🔷 Dreams',p:5000,s:[{n:'🔫 MP7 Abyssal',v:2500},{n:'🔥 AK Nightwish',v:6000},{n:'🔪 ★ Butterfly',v:15000}]},
  {n:'🔥 Kilowatt',p:10000,s:[{n:'⚡ Zeus Olympus',v:5000},{n:'🔥 AK Inheritance',v:12000},{n:'🔪 ★ Kukri',v:28000}]},
  {n:'🔮 Bravo',p:20000,s:[{n:'💥 Deagle Koi',v:10000},{n:'🔥 AK Fire Serpent',v:25000},{n:'🔪 ★ Karambit',v:55000}]},
  {n:'👑 Cobblestone',p:50000,s:[{n:'🔥 M4A1 Knight',v:25000},{n:'🎯 AWP Dragon Lore',v:65000},{n:'🔪 ★ M9 Bayonet',v:130000}]},
  {n:'🔪 Knife Case',p:100000,s:[{n:'🔪 ★ Gut Knife',v:45000},{n:'🔪 ★ Talon',v:110000},{n:'🔪 ★ Karambit Lore',v:250000}]}
];
document.getElementById('cGrid').innerHTML=cases.map((c,i)=>`<div class="card" style="text-align:center" onclick="sel(${i})"><b>${c.n}</b><br><span style="color:#4cd964">${c.p.toLocaleString()} 🪙</span></div>`).join('');
document.getElementById('sGrid').innerHTML=[{n:'🔫 P250',p:2500},{n:'🔥 AK-47',p:75000},{n:'🎯 AWP Asiimov',p:350000},{n:'🔪 Karambit',p:2000000}].map(x=>`<div class="card" style="text-align:center"><b>${x.n}</b><br><br><button class="n-btn act" onclick="buy('${x.n}',${x.p})">${x.p.toLocaleString()} 🪙</button></div>`).join('');

function sel(i){cIdx=i;let c=cases[i];window.scrollTo(0,0);document.getElementById('cTitle').innerText=c.n+' ('+c.p.toLocaleString()+' 🪙)';document.getElementById('spBtn').innerText='Keys ochish — '+c.p.toLocaleString()+' 🪙';fill();}
const tape=document.getElementById('tape');
function fill(){let pool=cases[cIdx].s;document.getElementById('drops').innerHTML='<b>Ichidagi skinlar:</b> '+pool.map(x=>x.n+' ('+x.v+')').join(' • ');tape.innerHTML='';tape.style.transition='none';tape.style.transform='translateX(0)';for(let i=0;i<35;i++){let x=pool[Math.floor(Math.random()*pool.length)];let d=document.createElement('div');d.className='s-item';d.innerHTML='<b>'+x.n+'</b><span style="color:#4cd964">'+x.v+'</span>';d.dataset.n=x.n;d.dataset.v=x.v;tape.appendChild(d);}}
fill();

function spin(){let c=cases[cIdx];if(bal<c.p)return alert('Mablag yetarli emas!');upd(-c.p,100);fill();document.getElementById('spBtn').disabled=true;setTimeout(()=>{let off=(25*95)-(tape.parentElement.offsetWidth/2)+47;tape.style.transition='transform 4s cubic-bezier(.1,.85,.2,1)';tape.style.transform='translateX(-'+off+'px)';setTimeout(()=>{let w=tape.children[25];inv.push({n:w.dataset.n,v:Number(w.dataset.v)});localStorage.setItem('i',JSON.stringify(inv));document.getElementById('cRes').innerText='🎉 '+w.dataset.n+' Inventarga tushdi!';document.getElementById('spBtn').disabled=false;},4100);},50);}
function drawInv(){document.getElementById('iGrid').innerHTML=inv.length?inv.map((x,i)=>`<div class="card" style="text-align:center"><b>${x.n}</b><br><br><button class="n-btn act" onclick="sell(${i})">Sotish +${x.v}</button></div>`).join(''):'<p style="color:#888">Inventar bo\'sh</p>';}
function sell(i){let s=inv.splice(i,1)[0];localStorage.setItem('i',JSON.stringify(inv));upd(s.v,10);drawInv();}
function buy(n,p){if(bal<p)return alert('Mablag yetarli emas!');upd(-p,200);inv.push({n,v:Math.floor(p*0.7)});localStorage.setItem('i',JSON.stringify(inv));alert(n+' olindi!');}
</script></body></html>
