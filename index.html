<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Skinlar & Keyslar</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0f1219;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1f2c;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a3245;
        }
        .balance {
            color: #ffd700;
            font-weight: bold;
            font-size: 16px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #1a1f2c;
            border: none;
            color: #8a94a6;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #2b5278;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(43, 82, 120, 0.4);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        /* CS2 Skin va Keys kartochkasi dizayni */
        .card {
            background: linear-gradient(145deg, #1c2230, #131722);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #2a3245;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.96);
        }
        /* CS2 Noyoblik ranglari (pastki chiziq va yorug'lik) */
        .rarity-covert { border-bottom: 4px solid #eb4b4b; box-shadow: inset 0 -15px 25px -15px rgba(235, 75, 75, 0.5); }
        .rarity-classified { border-bottom: 4px solid #d32ce6; box-shadow: inset 0 -15px 25px -15px rgba(211, 44, 230, 0.5); }
        .rarity-restricted { border-bottom: 4px solid #8847ff; box-shadow: inset 0 -15px 25px -15px rgba(136, 71, 255, 0.5); }
        .rarity-milspec { border-bottom: 4px solid #4b69ff; box-shadow: inset 0 -15px 25px -15px rgba(75, 105, 255, 0.5); }

        .card img {
            width: 100%;
            height: 95px;
            object-fit: contain;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.7));
            margin-bottom: 8px;
        }
        .weapon-name {
            font-size: 11px;
            color: #8a94a6;
            text-transform: uppercase;
        }
        .skin-name {
            font-size: 13px;
            font-weight: bold;
            margin: 3px 0 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .price-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            width: 100%;
        }
        /* Keys ichini ko'rish oynasi (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 13, 20, 0.95);
            z-index: 100;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .close-btn {
            background: #eb4b4b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
