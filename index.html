<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Skinoz App</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f131a; color: #fff; padding-bottom: 70px; overflow-x: hidden; }
        
        /* Tepa panel */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #161b24; border-bottom: 1px solid #232a38; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 900; font-size: 18px; color: #ff9900; letter-spacing: 1px; }
        .balance-box { background: #1f2735; padding: 6px 12px; border-radius: 8px; border: 1px solid #ff9900; font-weight: bold; color: #ffaa00; font-size: 14px; }

        /* Live Drop lentasi */
        .live-drop { background: #131720; padding: 8px; display: flex; gap: 8px; overflow: hidden; border-bottom: 1px solid #1e2532; }
        .drop-item { background: linear-gradient(135deg, #1d2432, #2a1b38); border-left: 3px solid #eb4b4b; padding: 5px 10px; border-radius: 6px; font-size: 11px; white-space: nowrap; }

        /* Bo'limlar (Tabs) */
        .tabs { display: flex; justify-content: space-around; background: #161b24; padding: 10px 5px; margin: 10px; border-radius: 10px; }
        .tab { background: none; border: none; color: #8a99b5; font-weight: bold; font-size: 14px; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
        .tab.active { background: #ff9900; color: #000; }

        .section { display: none; padding: 0 12px; }
        .section.active { display: block; }

        /* Ruletka oynasi */
        .roulette-wrap { position: relative; width: 100%; height: 110px; background: #161b24; border: 2px solid #2b3547; border-radius: 12px; overflow: hidden; margin: 15px 0; }
        .pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 3px; height: 100%; background: #ff9900; z-index: 10; box-shadow: 0 0 10px #ff9900; }
        .tape { display: flex; height: 100%; transition: transform 4s cubic-bezier(0.1, 0.85, 0.2, 1); }
        .skin-card { min-width: 100px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; border-right: 1px solid #232a38; padding: 5px; text-align: center; }
        .skin-card span { font-size: 28px; margin-bottom: 5px; }
        .skin-card p { font-size: 11px; font-weight: bold; }
        .rarity-blue { border-bottom: 4px solid #4b69ff; background: rgba(75, 105, 255, 0.1); }
        .rarity-pink { border-bottom: 4px solid #d32ce6; background: rgba(211, 44, 230, 0.1); }
        .rarity-red { border-bottom: 4px solid #eb4b4b; background: rgba(235, 75, 75, 0.15); }
        .rarity-gold { border-bottom: 4px solid #ffd700; background: rgba(255, 215, 0, 0.2); }

        /* Tugmalar va kartochkalar */
        .main-btn { background: linear-gradient(90deg, #ff8800, #ffbb00); color: #000; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3); }
        .main-btn:disabled { opacity: 0.5; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .item-box { background: #161b24; border: 1px solid #252e3f; border-radius: 10px; padding: 12px; text-align: center; }
        .item-box .icon { font-size: 35px; margin-bottom: 8px; }
        .item-box h4 { font-size: 13px; margin-bottom: 5px; }
        .buy-btn { background: #243044; color: #ffaa00; border: 1px solid #ffaa00; padding: 8px; width: 100%; border-radius: 6px; font-weight: bold; margin-top: 8px; cursor: pointer; }
        
        .result-toast { background: #1e283a; border: 1px solid #ff9900; padding: 12px; border-radius: 10px; margin-top: 15px; text-align: center; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ CS2 SKINOZ</div>
        <div class="balance-box">💰 <span id="bal">5000</span></div>
    </div>

    <div class="live-drop" id="liveDrop">
        <div class="drop-item">🔥 Aziz: AWP | Asiimov</div>
        <div class="drop-item">🔪 Bekzod: Karambit</div>
        <div class="drop-item">🔫 Sardor: AK-47 | Redline</div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('cases', this)">📦 KEYSLAR</button>
        <button class="tab" onclick="switchTab('upgrade', this)">⚡ UPGRADE</button>
        <button class="tab" onclick="switchTab('shop', this)">🛒 MAGAZIN</button>
    </div>

    <!-- KEYSLAR BO'LIMI -->
    <div id="cases" class="section active">
        <h3 style="text-align:center; margin-top:5px;">🔥 Dragon Lore Keys</h3>
        <div class="roulette-wrap">
            <div class="pointer"></div>
            <div class="tape" id="tape"></div>
        </div>
        <button class="main-btn" id="spinBtn" onclick="spinCase()">KEYS OCHISH — 1 000 💰</button>
        <div class="result-toast" id="caseResult"></div>
    </div>

    <!-- UPGRADE BO'LIMI -->
    <div id="upgrade" class="section">
        <div style="background:#161b24; padding:20px; border-radius:12px; text-align:center; margin-top:10px;">
            <h3>⚡ X2 UPGRADE</h3>
            <p style="color:#8a99b5; font-size:13px; margin:10px 0;">Tangalaringizni 2 barobar ko'paytiring (Imkoniyat: 45%)</p>
            <button class="main-btn" style="margin-bottom:10px;" onclick="playUpgrade(500)">500 💰 TIKISH (X2)</button>
            <button class="main-btn" onclick="playUpgrade(2500)">2 500 💰 TIKISH (X2)</button>
            <div class="result-toast" id="upgResult"></div>
        </div>
    </div>

    <!-- MAGAZIN BO'LIMI -->
    <div id="shop" class="section">
        <div class="grid">
            <div class="item-box">
                <div class="icon">📦</div>
                <h4>Grafiti / Quti</h4>
                <button class="buy-btn" onclick="buySkin('Grafiti', 500)">500 💰</button>
            </div>
            <div class="item-box">
                <div class="icon">🔫</div>
                <h4>P250 | Sand Dune</h4>
                <button class="buy-btn" onclick="buySkin('P250 | Sand Dune', 2500)">2 500 💰</button>
            </div>
            <div class="item-box">
                <div class="icon">🔫</div>
                <h4>AK-47 | Safari Mesh</h4>
                <button class="buy-btn" onclick="buySkin('AK-47 | Safari Mesh', 75000)">75 000 💰</button>
            </div>
            <div class="item-box">
                <div class="icon">🔪</div>
                <h4>Karambit | Lore</h4>
                <button class="buy-btn" onclick="buySkin('Karambit | Lore', 2000000)">2 000 000 💰</button>
            </div>
        </div>
        <div class="result-toast" id="shopResult"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let balance = Number(localStorage.getItem('cs2_bal')) || 5000;
        document.getElementById('bal').innerText = balance.toLocaleString();

        function updateBal(amount) {
            balance += amount;
            localStorage.setItem('cs2_bal', balance);
            document.getElementById('bal').innerText = balance.toLocaleString();
        }

        function switchTab(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        const skins = [
            { name: 'P250 | Sand', val: 400, icon: '🔫', cls: 'rarity-blue' },
            { name: 'Glock | Blaze', val: 800, icon: '🔫', cls: 'rarity-blue' },
            { name: 'AK-47 | Redline', val: 1500, icon: '🔥', cls: 'rarity-pink' },
            { name: 'AWP | Asiimov', val: 3000, icon: '🎯', cls: 'rarity-red' },
            { name: 'Karambit Gold', val: 10000, icon: '🔪', cls: 'rarity-gold' }
        ];

        const tape = document.getElementById('tape');
        function buildTape() {
            tape.innerHTML = '';
            tape.style.transition = 'none';
            tape.style.transform = 'translateX(0px)';
            for (let i = 0; i < 40; i++) {
                const s = skins[Math.floor(Math.random() * skins.length)];
                const div = document.createElement('div');
                div.className = `skin-card ${s.cls}`;
                div.innerHTML = `<span>${s.icon}</span><p>${s.name}</p><p style="color:#ffaa00">${s.val} 💰</p>`;
                div.dataset.val = s.val;
                div.dataset.name = s.name;
                tape.appendChild(div);
            }
        }
        buildTape();

        function spinCase() {
            if (balance < 1000) return alert('Balans yetarli emas!');
            const btn = document.getElementById('spinBtn');
            const res = document.getElementById('caseResult');
            btn.disabled = true;
            res.style.display = 'none';
            updateBal(-1000);
            buildTape();

            setTimeout(() => {
                const winIndex = 28;
                const offset = (winIndex * 100) - (tape.parentElement.offsetWidth / 2) + 50;
                tape.style.transition = 'transform 4s cubic-bezier(0.1, 0.85, 0.2, 1)';
                tape.style.transform = `translateX(-${offset}px)`;

                setTimeout(() => {
                    const wonCard = tape.children[winIndex];
                    const winVal = Number(wonCard.dataset.val);
                    const winName = wonCard.dataset.name;
                    updateBal(winVal);
                    res.innerText = `🎉 YUTUQ: ${winName} (+${winVal} 💰)`;
                    res.style.display = 'block';
                    btn.disabled = false;
                }, 4100);
            }, 50);
        }

        function playUpgrade(bet) {
            if (balance < bet) return alert('Balans yetarli emas!');
            const res = document.getElementById('upgResult');
            if (Math.random() < 0.45) {
                updateBal(bet);
                res.style.borderColor = '#00ff88';
                res.innerText = `🎉 UPGRADE O'XSHADI! +${bet.toLocaleString()} 💰`;
            } else {
                updateBal(-bet);
                res.style.borderColor = '#ff4444';
                res.innerText = `💥 KUYDI! -${bet.toLocaleString()} 💰`;
            }
            res.style.display = 'block';
        }

        function buySkin(name, price) {
            if (balance < price) return alert(`Mablag' yetarli emas! Kerak: ${price.toLocaleString()} 💰`);
            updateBal(-price);
            const res = document.getElementById('shopResult');
            res.innerText = `✅ ${name} sotib olindi! Bot chatiga kirib Trade URL orqali qabul qiling.`;
            res.style.display = 'block';
        }
    </script>
</body>
</html>
